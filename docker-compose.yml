version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: retail_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retail_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: retail_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      # Use the Docker service name 'db' instead of 'localhost'
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/retail_inventory
      FLASK_ENV: production
    depends_on:
      - db

volumes:
  postgres_data:
